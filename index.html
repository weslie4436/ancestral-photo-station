<script>
(function () {
  function stopZoom(ev) {
    if (ev.target && ev.target.closest && ev.target.closest(".pswp")) return;
    ev.preventDefault();
  }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>

<script>
(function () {
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var stored = "";
  try { stored = localStorage.getItem("family.viewKey") || ""; } catch (e) {}
  var cookie = "";
  try {
    var m = document.cookie.match(/(?:^|; )family\.viewKey=([^;]*)/);
    cookie = m ? decodeURIComponent(m[1]) : "";
  } catch (e) {}
  var q = new URLSearchParams(location.search).get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(q) ? q : KEY_RE.test(h) ? h : "";
  var token = fromUrl || (KEY_RE.test(stored) ? stored : "") || (KEY_RE.test(cookie) ? cookie : "");
  window.FAMILY_URL_KEY = fromUrl;
  window.FAMILY_VIEW_KEY = token;
  if (token) {
    try { localStorage.setItem("family.viewKey", token); } catch (e) {}
    try {
      var path = location.pathname.replace(/[^/]+$/, "") || "/";
      document.cookie = "family.viewKey=" + encodeURIComponent(token) + "; path=" + path + "; max-age=31536000; Secure; SameSite=Lax";
    } catch (e) {}
    // No <link rel="manifest">: iOS would launch start_url ./ without the key.
    // Query can be dropped on web clips; hash is more likely to survive.
    if (typeof navigator.standalone === "boolean" && !navigator.standalone) {
      var pin =
        location.pathname +
        "?k=" + encodeURIComponent(token) +
        "#k=" + encodeURIComponent(token);
      if (location.pathname + location.search + location.hash !== pin) {
        history.replaceState({}, "", pin);
      }
    }
  }
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" id="blobs" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
</div>
<div class="hall with-feed is-booting" id="hall">
  <div class="profile">
    <div class="rose-two" id="rose-two"></div>
    <h1 class="brand">Famiphoto</h1>
    <p class="status" id="status">正在連接備份硬碟…</p>
  </div>
  <div class="invite-panel" id="invite-panel" hidden>

    <form id="invite-apple-form" hidden>

      <label for="invite-apple">Apple ID</label>
      <div class="apple-row">
        <input id="invite-apple" type="email" autocomplete="username" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <form id="invite-pass-form" hidden>
      <p class="err" id="invite-pass-err"></p>
      <label for="invite-pass">密碼</label>
      <div class="apple-row">
        <input id="invite-pass" type="password" autocomplete="current-password" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <form id="invite-mfa" hidden>
      <p class="err" id="invite-mfa-err"></p>
      <label for="invite-code">驗證碼</label>
      <div class="apple-row">
        <input id="invite-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <div class="invite-wait" id="invite-wait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="invite-wait-bar"></div>
    </div>
  </div>
  <div class="stage-bg" id="stage-bg" hidden></div>
  <div class="home-head" id="home-head" hidden>
    <div class="cab-hud" id="cab-hud" hidden>
      <div class="cab-wrap">
        <div class="cab-cover">
          <div class="cab-ring" aria-hidden="true"></div>
          <div class="cab-face">
            <img id="face-img" alt="" src="./face-default.jpg?v=2"/>

            <span class="cab-shield" aria-hidden="true"></span>
          </div>
        </div>
        <div id="album-settings" class="album-settings" hidden></div>
      </div>
      <p class="reader-name" id="reader-name"></p>
      <div class="cab-caption" id="cab-caption" hidden>
        <span class="hp-text"></span>
        <span class="hp-alt" hidden><span class="hp-alt-pct"></span><span class="hp-alt-count"></span></span>
      </div>
    </div>
    <div class="tag-board" id="tag-board" hidden></div>
  </div>
  <div id="album" hidden>
    <div class="feed" id="feed"></div>
    <p class="feed-hint" id="feed-hint" hidden>讀取照片中…</p>
    <div class="feed-sentinel" id="feed-sentinel" hidden></div>
  </div>
</div>
<aside class="photo-rail" id="photo-rail" hidden aria-label="照片操作"></aside>
<input id="cover-input" type="file" accept="image/*" hidden/>
<input id="backdrop-input" type="file" accept="image/*" hidden/>

      <p id="waitTitle">更換背景中</p>
    </div>

    <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>
